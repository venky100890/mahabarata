name: Kurukshetra Asset Forge

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Assets to generate in this run (maximum 30)
        required: true
        default: "30"
      category:
        description: Optional exact manifest category
        required: false
        default: ""
      name_filter:
        description: Optional asset-name substring
        required: false
        default: ""
      continue_until_done:
        description: Dispatch another 30-asset run while pending assets remain
        type: boolean
        required: true
        default: true
  schedule:
    # Safety-net resume. Completed manifests exit without generating anything.
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: kurukshetra-asset-forge
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      OPENAI_TRANSPARENT_IMAGE_MODEL: ${{ vars.OPENAI_TRANSPARENT_IMAGE_MODEL || 'gpt-image-1.5' }}
      OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
      MANIFEST_DRIVE_FILE_ID: ${{ vars.MANIFEST_DRIVE_FILE_ID || '1hG9ZtnEGhkzDcv70p6s_ayOk74fnC0UN' }}
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
      DRIVE_HEROES_FOLDER_ID: ${{ vars.DRIVE_HEROES_FOLDER_ID }}
      DRIVE_TROOPS_FOLDER_ID: ${{ vars.DRIVE_TROOPS_FOLDER_ID }}
      DRIVE_BUILDINGS_FOLDER_ID: ${{ vars.DRIVE_BUILDINGS_FOLDER_ID }}
      DRIVE_VFX_FOLDER_ID: ${{ vars.DRIVE_VFX_FOLDER_ID }}
      DRIVE_ENVIRONMENTS_FOLDER_ID: ${{ vars.DRIVE_ENVIRONMENTS_FOLDER_ID }}
      DRIVE_UI_FOLDER_ID: ${{ vars.DRIVE_UI_FOLDER_ID }}
      ASSET_FORGE_PAT: ${{ secrets.ASSET_FORGE_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/asset_forge/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/asset_forge/requirements.txt

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY secret"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_BASE64" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 secret"; exit 1; }
          test -n "$DRIVE_ROOT_FOLDER_ID" || { echo "Missing DRIVE_ROOT_FOLDER_ID repository variable"; exit 1; }

      - name: Download latest manifest from Drive
        run: |
          python tools/asset_forge/sync_manifest.py \
            --file-id "$MANIFEST_DRIVE_FILE_ID" \
            --output tools/asset_forge/data/kurukshetra_full_prompt_list.csv

      - name: Resolve run inputs
        id: inputs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "batch_size=${{ inputs.batch_size }}" >> "$GITHUB_OUTPUT"
            echo "category=${{ inputs.category }}" >> "$GITHUB_OUTPUT"
            echo "name_filter=${{ inputs.name_filter }}" >> "$GITHUB_OUTPUT"
            echo "continue_until_done=${{ inputs.continue_until_done }}" >> "$GITHUB_OUTPUT"
          else
            echo "batch_size=30" >> "$GITHUB_OUTPUT"
            echo "category=" >> "$GITHUB_OUTPUT"
            echo "name_filter=" >> "$GITHUB_OUTPUT"
            echo "continue_until_done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and upload one batch
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --batch-size "${{ steps.inputs.outputs.batch_size }}"
            --manifest tools/asset_forge/data/kurukshetra_full_prompt_list.csv
            --checkpoint tools/asset_forge/state/checkpoint.csv
            --output-dir generated_assets
          )
          if [[ -n "${{ steps.inputs.outputs.category }}" ]]; then
            args+=(--category "${{ steps.inputs.outputs.category }}")
          fi
          if [[ -n "${{ steps.inputs.outputs.name_filter }}" ]]; then
            args+=(--name-filter "${{ steps.inputs.outputs.name_filter }}")
          fi
          python tools/asset_forge/generate_assets.py "${args[@]}" | tee asset-forge-status.json

      - name: Compute remaining work
        id: status
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('tools/asset_forge/state/checkpoint.csv')
          rows = list(csv.DictReader(p.open()))
          uploaded = sum(r['status'] == 'uploaded' for r in rows)
          blocked = sum(r['status'] == 'blocked' for r in rows)
          pending = len(rows) - uploaded - blocked
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"total={len(rows)}\n")
              f.write(f"uploaded={uploaded}\n")
              f.write(f"blocked={blocked}\n")
              f.write(f"pending={pending}\n")
          print({'total': len(rows), 'uploaded': uploaded, 'blocked': blocked, 'pending': pending})
          PY

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurukshetra-asset-forge-checkpoint-${{ github.run_number }}
          path: |
            tools/asset_forge/state/checkpoint.csv
            asset-forge-status.json
          retention-days: 90

      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kurukshetra-asset-forge[bot]"
          git config user.email "kurukshetra-asset-forge[bot]@users.noreply.github.com"
          git add tools/asset_forge/state/checkpoint.csv
          if git diff --cached --quiet; then
            echo "No checkpoint change"
          else
            git commit -m "Update Asset Forge checkpoint (${{ steps.status.outputs.uploaded }}/${{ steps.status.outputs.total }})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Write job summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Kurukshetra Asset Forge

          - Total: ${{ steps.status.outputs.total }}
          - Uploaded: ${{ steps.status.outputs.uploaded }}
          - Pending: ${{ steps.status.outputs.pending }}
          - Blocked: ${{ steps.status.outputs.blocked }}
          - Batch size: ${{ steps.inputs.outputs.batch_size }}
          EOF

      - name: Dispatch next batch
        if: steps.status.outputs.pending != '0' && steps.inputs.outputs.continue_until_done == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ASSET_FORGE_PAT" ]]; then
            echo "ASSET_FORGE_PAT is not configured. The 6-hour schedule will resume the next batch."
            exit 0
          fi
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ASSET_FORGE_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/kurukshetra-asset-forge.yml/dispatches" \
            -d '{"ref":"'"${GITHUB_REF_NAME}"'","inputs":{"batch_size":"30","category":"","name_filter":"","continue_until_done":"true"}}'
